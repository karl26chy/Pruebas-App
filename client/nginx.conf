# ============================================================
#  Nginx - Plataforma Educativa Multi-Institución
#  Reemplaza TU_DOMINIO por tu dominio real, por ejemplo:
#  server_name ~^(?<subdomain>.+)\.plataforma\.com$;
#
#  Plantilla de runtime: el entrypoint oficial de Nginx sustituye
#  ${PORT} (Render lo inyecta) y ${BACKEND_URL} (URL del backend).
#  En Docker Compose local: PORT=80, BACKEND_URL=http://api:5000.
# ============================================================

# Institución genérica por subdominio: colegio1.midominio.com
server {
    listen ${PORT};
    server_name ~^(?<subdomain>.+)\.TU_DOMINIO$;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Subdomain $subdomain;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;
    }

    # Cache assets con hash (Vite genera nombres únicos)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

